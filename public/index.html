<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TCP Forward</title>
    <link rel="stylesheet" href="/admin.css" />
  </head>
  <body>
    <main class="page">
      <section class="card">
        <p class="eyebrow">TCP Forward</p>
        <h1>固定监听 7777</h1>
        <p class="description">
          一行填一个目标地址，格式是 <code>host:port</code>。收到的消息会转发到所有目标，客户端回包走第一行目标。
        </p>

        <form id="config-form" class="form">
          <label class="label" for="targets">转发目标</label>
          <textarea
            id="targets"
            name="targets"
            rows="8"
            placeholder="127.0.0.1:9001&#10;127.0.0.1:9002"
          ></textarea>

          <button id="save-button" type="submit" disabled>保存</button>
          <div id="status" class="status"></div>
        </form>
      </section>

      <section class="card info">
        <h2>运行信息</h2>
        <div class="info-item">
          <span>监听地址</span>
          <strong id="listen-address">加载中...</strong>
        </div>
        <div class="info-item">
          <span>管理页面</span>
          <strong id="admin-address">加载中...</strong>
        </div>
        <div class="info-item">
          <span>目标数量</span>
          <strong id="target-count">加载中...</strong>
        </div>
        <div class="info-item">
          <span>配置文件</span>
          <strong id="config-path">加载中...</strong>
        </div>
      </section>
    </main>

    <script src="/admin.js"></script>
  </body>
</html>
