<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>登录 · TCP 转发控制台</title>
    <link rel="stylesheet" href="/login.css" />
  </head>
  <body>
    <main class="login-shell">
      <section class="login-intro">
        <p class="eyebrow">MZPOWER · TCP ROUTING</p>
        <h1>报文转发<br />控制台</h1>
        <p>使用美卓平台账号登录后管理转发规则、设备范围与运行日志。</p>
        <div class="route-mark" aria-hidden="true">
          <span>DEVICE</span><i></i><strong>7777</strong><i></i><span>UPSTREAM</span>
        </div>
      </section>

      <section class="login-card" aria-labelledby="login-title">
        <div>
          <p class="card-index">ADMIN ACCESS</p>
          <h2 id="login-title">管理员登录</h2>
          <p class="card-lede">请输入美卓平台账号与密码</p>
        </div>
        <form id="login-form">
          <label>
            <span>账号</span>
            <input id="account" name="account" type="text" autocomplete="username" required autofocus />
          </label>
          <label>
            <span>密码</span>
            <input id="password" name="password" type="password" autocomplete="current-password" required />
          </label>
          <p id="login-status" class="login-status" role="status" aria-live="polite"></p>
          <button id="login-button" type="submit">登录控制台 <span aria-hidden="true">→</span></button>
        </form>
        <p class="login-footnote">账号认证由 platform.mzpower.com 提供</p>
      </section>
    </main>
    <script src="/login.js"></script>
  </body>
</html>
